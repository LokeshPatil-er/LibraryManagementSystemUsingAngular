<div class="d-flex align-items-center justify-content-center vh-100">
  <div class="card login-card shadow-lg">
    <div class="card-body p-4">
      <h3 class="text-center mb-4 text-primary">Login</h3>
      
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" [(ngModel)]="Email" name="inputEmail" class="form-control" id="email" placeholder="Enter your email" required>
          <div id="emailHelp" class="form-text">We'll never share your email.</div>
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              [(ngModel)]="Password" 
              name="inputPassword" 
              class="form-control" 
              id="password" 
              placeholder="Enter your password" 
              required
            >
            <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()">
              <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
        </div>

        
        <div class="mb-3 form-check">
          <input type="checkbox" [(ngModel)]="isRemeberMe" name="RememberMe" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

     
    </div>
  </div>
</div>
